# Имя workflow, которое будет отображаться на вкладке "Actions"
name: Проверка model.ipynb

# Триггеры: запускать при push и pull_request в ветку main,
# но только если изменения затронули model.ipynb, requirements.txt,
# requirements-dev.txt, pyproject.toml или сам workflow.
on:
  push:
    branches: [ main ]
    paths:
      - 'model.ipynb'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/notebook-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'model.ipynb'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/notebook-check.yml'

# Права токена. Нам НЕ нужно contents: write, потому что CI ничего не коммитит.
permissions:
  contents: read

jobs:
  lint-and-test:
    # Фиксируем конкретную версию Ubuntu, чтобы избежать неожиданностей
    # при миграции метки ubuntu-latest на Ubuntu 26.04.
    runs-on: ubuntu-24.04

    steps:
      # 1. Клонируем репозиторий. Используем v5 — поддерживает Node.js 24.
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Устанавливаем Python. Используем v6 — поддерживает Node.js 24.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 3. Устанавливаем зависимости в виртуальное окружение.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install virtualenv
          virtualenv venv
          source venv/bin/activate
          pip install black ruff nbconvert nbstripout
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 4. Проверка сортировки импортов с помощью ruff.
      - name: Check imports with Ruff
        run: |
          source venv/bin/activate
          ruff check --select I model.ipynb

      # 5. Проверка форматирования с помощью Black.
      - name: Check formatting with Black
        run: |
          source venv/bin/activate
          black --check model.ipynb

      # 6. Линтинг с помощью Ruff (стиль, ошибки, баги).
      - name: Lint with Ruff
        run: |
          source venv/bin/activate
          ruff check model.ipynb

      # 7. Проверка, что в ноутбуке нет сохранённых выходных данных.
      - name: Verify notebook has no outputs
        run: |
          source venv/bin/activate
          nbstripout --verify model.ipynb

      # 8. Выполнение ноутбука — проверка на ошибки времени выполнения.
      # - name: Execute notebook
        # run: |
          # source venv/bin/activate
          # jupyter nbconvert --to notebook --execute --inplace model.ipynb