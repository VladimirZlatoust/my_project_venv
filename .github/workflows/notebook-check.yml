# Имя workflow, которое будет отображаться на вкладке "Actions" в GitHub
name: Проверка model.ipynb

# Триггеры: запускать workflow при push и pull_request в ветку main, но только если изменения затронули model.ipynb, requirements.txt или сам workflow.
on:
  push:
    branches: [ main ]
    paths:
      - 'model.ipynb'
      - 'requirements.txt'
      - '.github/workflows/notebook-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'model.ipynb'
      - 'requirements.txt'
      - '.github/workflows/notebook-check.yml'

jobs:

  lint-and-test:
    # Запускаем на последней версии Ubuntu.
    runs-on: ubuntu-24.04

    steps:
      # 1. Клонируем репозиторий на виртуальную машину.
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Устанавливаем нужную версию Python.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 3. Устанавливаем зависимости и инструменты проверки. Используем virtualenv для изоляции окружения.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install virtualenv
          virtualenv venv
          source venv/bin/activate
          # Инструменты для линтинга и проверки ноутбуков
          pip install nbqa black isort flake8 nbconvert nbstripout
          # Устанавливаем зависимости проекта
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 4. Проверка форматирования кода в ноутбуке с помощью Black. nbqa применяет black к каждой ячейке кода. Флаг --check заставляет black только проверять, не изменяя файл.
      - name: Lint with Black
        run: |
          source venv/bin/activate
          nbqa black --check model.ipynb

      # 5. Проверка порядка импортов с помощью isort.
      - name: Lint with isort
        run: |
          source venv/bin/activate
          nbqa isort --check-only model.ipynb

      # 6. Проверка синтаксиса и стиля с помощью Flake8.
      - name: Lint with Flake8
        run: |
          source venv/bin/activate
          nbqa flake8 model.ipynb

      # 7. Проверка, что в ноутбуке нет сохранённых выходных данных, выходные данные могут быть большими, содержать конфиденциальную информацию и захламлять историю git.
      - name: Verify notebook has no outputs
        run: |
          source venv/bin/activate
          nbstripout --verify model.ipynb

      # 8. Выполняем ноутбук целиком, чтобы убедиться, что он работает без ошибок. Флаг --execute запускает все ячейки.
      - name: Execute notebook
        run: |
          source venv/bin/activate
          jupyter nbconvert --to notebook --execute --inplace model.ipynb