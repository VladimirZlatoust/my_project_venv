# Конфигурация инструментов для проекта.
# Используется локально и в GitHub Actions, чтобы поведение было одинаковым.

[tool.black]
# Длина строки. 88 — дефолт Black, специально не меняем,
# чтобы не было расхождений с типичными проектами.
line-length = 88
# Минимальная версия Python, под которую оптимизируется форматирование.
target-version = ['py311']
# Исключаем служебные каталоги.
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
)/
'''

[tool.ruff]
# Длина строки должна совпадать с Black, иначе ruff и Black будут
# конфликтовать по правилу E501 (line too long).
line-length = 88
target-version = "py311"
# Исключаем служебные каталоги.
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
# Набор правил:
#   E, W — pycodestyle (стиль)
#   F    — pyflakes (ошибки)
#   I    — isort (сортировка импортов, совместимая с Black)
#   B    — flake8-bugbear (потенциальные баги)
#   UP   — pyupgrade (устаревший синтаксис)
select = ["E", "W", "F", "I", "B", "UP"]
# Игнорируем E501 (line too long) — длину строк контролирует Black.
# Обратите внимание: E203 и W503 в ruff НЕ существуют как отдельные
# правила, они реализованы внутри стиля Black, поэтому их здесь быть
# не должно — ruff упадёт с "Unknown rule selector".
ignore = ["E501"]

[tool.ruff.lint.isort]
# Явно указываем, что сортировка импортов должна быть в стиле Black.
# Это гарантирует, что ruff не будет конфликтовать с Black.
known-first-party = ["model"]